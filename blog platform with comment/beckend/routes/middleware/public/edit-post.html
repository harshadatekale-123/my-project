<!DOCTYPE html>
<html>
<head>
    <title>Edit Post</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <h1>Edit Post</h1>

    <form id="editForm">

        <input
            type="text"
            id="title"
            required
        >

        <textarea
            id="content"
            required
        ></textarea>

        <button type="submit">
            Update Post
        </button>

    </form>

    <p id="message"></p>

</div>

<script src="js/edit-post.js"></script>

</body>
</html>
