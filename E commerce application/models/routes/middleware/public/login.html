<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

    <h2>ShopEasy</h2>

    <a href="index.html">Home</a>

</nav>


<div class="form-container">

    <h1>Login</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="register.html">Register</a>
    </p>

</div>


<script src="login.js"></script>

</body>

</html>
