<!DOCTYPE html>
<html>

<head>

    <title>Admin Panel</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

    <h2>Admin Panel</h2>

    <div>

        <a href="index.html">Store</a>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</nav>


<div class="admin-container">

    <h1>Add Product</h1>


    <form id="productForm">

        <input
            id="name"
            placeholder="Product Name"
            required
        >

        <input
            id="price"
            type="number"
            placeholder="Price"
            required
        >

        <input
            id="image"
            placeholder="Image URL"
            required
        >

        <textarea
            id="description"
            placeholder="Description"
            required>
        </textarea>


        <button type="submit">
            Add Product
        </button>

    </form>


    <h1>Products</h1>

    <div id="products"></div>


    <h1>All Orders</h1>

    <div id="orders"></div>

</div>


<script src="admin.js"></script>

</body>

</html>
